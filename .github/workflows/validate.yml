name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-skills:
    runs-on: namespace-profile-sawmills-runner
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Validate skill layout
        run: scripts/validate-skills
      - name: Run validator tests
        run: ruby scripts/validate-skills.test.rb

